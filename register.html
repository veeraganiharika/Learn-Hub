
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub | Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="logo.jpg" alt="LearnHub Logo">
            <span>LearnHub</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html" class="nav-button">Login</a>
        </nav>
    </header>

    <main class="account-page">
        <form class="form-container register-form" action="success.html">
            <div class="form-logo">
                <img src="logo.jpg" alt="LearnHub Logo">
            </div>

            <span class="tag">JOIN OUR COMMUNITY</span>
            <h1>Create Account</h1>
            <p>Register today and start learning.</p>

            <label for="register-name">Full Name</label>
            <input type="text" id="register-name"
                   placeholder="Enter your full name" required>

            <label for="register-email">Email Address</label>
            <input type="email" id="register-email"
                   placeholder="Enter your email" required>

            <label for="register-phone">Phone Number</label>
            <input type="tel" id="register-phone"
                   placeholder="Enter 10-digit phone number"
                   pattern="[0-9]{10}" required>

            <label for="register-password">Password</label>
            <input type="password" id="register-password"
                   placeholder="Create a password" required>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password"
                   placeholder="Confirm your password" required>

            <button type="submit" class="btn">Create Account</button>

            <p class="form-bottom">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </form>
    </main>

    <footer class="footer">
        <h3>LearnHub</h3>
        <p>Learn Today. Lead Tomorrow.</p>
        <p class="copyright">© 2026 LearnHub. All Rights Reserved.</p>
    </footer>

</body>
</html>
