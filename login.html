
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub | Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="logo.jpg" alt="LearnHub Logo">
            <span>LearnHub</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html" class="nav-button active">Login</a>
        </nav>
    </header>

    <main class="account-page">
        <form class="form-container" action="success.html">
            <div class="form-logo">
                <img src="logo.jpg" alt="LearnHub Logo">
            </div>

            <span class="tag">WELCOME BACK</span>
            <h1>Login to LearnHub</h1>
            <p>Continue your learning journey with us.</p>

            <label for="login-email">Email Address</label>
            <input type="email" id="login-email"
                   placeholder="Enter your email" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password"
                   placeholder="Enter your password" required>

            <button type="submit" class="btn">Login</button>

            <p class="form-bottom">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>
        </form>
    </main>

    <footer class="footer">
        <h3>LearnHub</h3>
        <p>Learn Today. Lead Tomorrow.</p>
        <p class="copyright">© 2026 LearnHub. All Rights Reserved.</p>
    </footer>

</body>
</html>
